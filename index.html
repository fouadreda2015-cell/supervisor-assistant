<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>مساعد المشرف التربوي</title>
<meta name="theme-color" content="#0e5c63">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="مساعد المشرف">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<style>
:root{
  --brand:#0e5c63; --brand-2:#e7f1f1; --ink:#1d2329; --muted:#66707a; --line:#e3e6ea;
  --bg:#f5f6f8; --card:#fff; --ok:#1f7a4d; --warn:#b4570f; --bad:#b3261e;
  --t-school:#2f6fb0; --t-class:#0e5c63; --t-exchange:#7a4fb0; --t-model:#a3622a;
  --t-meeting:#4f6b2a; --t-course:#b0306a; --t-other:#7a838c;
  --radius:14px; --safe-b:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,"SF Arabic","Segoe UI","Noto Sans Arabic",Tahoma,Arial,sans-serif;
  background:var(--bg);color:var(--ink);font-size:16px;line-height:1.55;-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--brand)}
.app{min-height:100vh;display:flex;flex-direction:column}
header.top{position:sticky;top:0;z-index:20;background:var(--brand);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;display:flex;align-items:center;gap:10px}
header.top h1{font-size:18px;margin:0;font-weight:700;flex:1}
header.top .sub{font-size:13px;opacity:.85}
.iconbtn{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:10px;padding:7px 11px;cursor:pointer}
main{flex:1;padding:16px;padding-bottom:calc(90px + var(--safe-b));max-width:980px;width:100%;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);
  display:flex;padding-bottom:var(--safe-b)}
nav.tabs a{flex:1;text-align:center;padding:9px 2px 8px;text-decoration:none;color:var(--muted);font-size:12px}
nav.tabs a .ic{display:block;font-size:21px;line-height:1.2}
nav.tabs a.on{color:var(--brand);font-weight:700}
@media (min-width:900px){
  .app{flex-direction:row}
  .shell{flex:1;display:flex;flex-direction:column;min-width:0}
  nav.tabs{position:sticky;top:0;height:100vh;width:200px;flex-direction:column;border-top:0;border-left:1px solid var(--line);padding-top:70px}
  nav.tabs a{flex:0;display:flex;gap:10px;align-items:center;padding:12px 18px;font-size:15px;text-align:right}
  nav.tabs a .ic{display:inline;font-size:19px}
  nav.tabs a.on{background:var(--brand-2)}
  main{padding:24px 28px 40px}
}
@media (max-width:899px){.shell{display:contents}}
h2{font-size:17px;margin:22px 0 10px;display:flex;align-items:center;gap:8px}
h2 .count{background:var(--brand-2);color:var(--brand);border-radius:20px;padding:0 9px;font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:10px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (min-width:600px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px}
.stat b{display:block;font-size:26px;line-height:1.2;color:var(--brand)}
.stat span{font-size:13px;color:var(--muted)}
.stat.warn b{color:var(--warn)}
.ev{display:flex;gap:12px;align-items:flex-start;background:#fff;border:1px solid var(--line);
  border-right:5px solid var(--tc,var(--t-other));border-radius:12px;padding:11px 13px;margin-bottom:8px;cursor:pointer}
.ev .when{min-width:58px;text-align:center;font-size:13px;color:var(--muted)}
.ev .when b{display:block;font-size:18px;color:var(--ink)}
.ev .body{flex:1;min-width:0}
.ev .ttl{font-weight:700}
.ev .meta{font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:12px;border-radius:20px;padding:1px 9px;background:#eef0f2;color:#444;margin-left:4px}
.tag.type{background:color-mix(in srgb,var(--tc) 14%,#fff);color:var(--tc)}
.tag.done{background:#e3f2ea;color:var(--ok)}
.tag.missed{background:#fbeee3;color:var(--warn)}
.tag.cancelled{background:#f6e3e2;color:var(--bad)}
.tag.postponed{background:#fff3cd;color:#8a6200}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;cursor:pointer;font-size:15px;
  display:inline-flex;align-items:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:700}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5}
.fab{position:fixed;left:18px;bottom:calc(78px + var(--safe-b));z-index:25;width:56px;height:56px;border-radius:50%;
  border:0;background:var(--brand);color:#fff;font-size:30px;box-shadow:0 6px 18px rgba(0,0,0,.2);cursor:pointer}
@media (min-width:900px){.fab{bottom:28px;left:28px}}
.empty{color:var(--muted);text-align:center;padding:18px;background:#fff;border:1px dashed var(--line);border-radius:12px}
.banner{background:#fff6e6;border:1px solid #f1d3a3;border-radius:12px;padding:12px 14px;margin-bottom:12px;font-size:14px}
.banner.info{background:var(--brand-2);border-color:#c9e0e0}
.search{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0;scrollbar-width:none}
.chip{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.list-item{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;cursor:pointer}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--brand-2);color:var(--brand);display:flex;align-items:center;justify-content:center;font-weight:700;flex-shrink:0}
.list-item .body{flex:1;min-width:0}
.list-item .ttl{font-weight:700}
.list-item .meta{font-size:13px;color:var(--muted)}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
.back{display:inline-block;margin-bottom:8px;text-decoration:none;font-size:15px}
/* calendar */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:6px 0}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{text-align:center;font-size:12px;color:var(--muted);padding:4px 0}
.cal .d{background:#fff;border:1px solid var(--line);border-radius:10px;min-height:52px;padding:4px;cursor:pointer;font-size:14px;position:relative}
.cal .d.out{opacity:.35}
.cal .d.today{border-color:var(--brand);border-width:2px}
.cal .d.sel{background:var(--brand-2)}
.cal .dots{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px}
.cal .dots i{width:7px;height:7px;border-radius:50%;background:var(--tc)}
/* modal */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media (min-width:700px){.modal-bg{align-items:center}}
.modal{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:18px 18px calc(18px + var(--safe-b))}
@media (min-width:700px){.modal{border-radius:18px}}
.modal h3{margin:0 0 12px;font-size:18px}
.field{margin-bottom:12px}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:4px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:16px}
.field textarea{min-height:70px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.field .checks label{display:flex;margin:0;align-items:center;gap:5px;border:1px solid var(--line);border-radius:20px;padding:4px 11px;font-size:14px;color:var(--ink);cursor:pointer}
.multi{max-height:170px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:6px 10px}
.field .multi label{display:flex;gap:10px;align-items:center;justify-content:flex-start;padding:6px 0;margin:0;font-size:15px;color:var(--ink);border-bottom:1px solid #f1f2f4}
.field .multi label:last-child{border-bottom:0}
.field .multi input,.field .checks input{width:auto;flex:0 0 auto;margin:0;accent-color:var(--brand)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + var(--safe-b));background:#1d2329;color:#fff;
  padding:10px 18px;border-radius:12px;z-index:60;font-size:15px;max-width:90vw;text-align:center}
.soon{opacity:.75}
.soon .tag{background:#fff3cd;color:#8a6200}
.small{font-size:13px;color:var(--muted)}
.sheet-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

:root{--t-personal:#3a7d44;--t-family:#c0612b;--t-health:#c23b4e;--t-money:#8a6d1d;--t-travel:#2a7fa0;--t-occasion:#9b3fa6;--t-holiday:#b3261e;--t-schoolev:#5d6b78}
.scope{display:flex;background:#fff;border:1px solid var(--line);border-radius:12px;padding:3px;margin-bottom:12px}
.scope button{flex:1;border:0;background:transparent;padding:8px 4px;border-radius:9px;font-size:15px;cursor:pointer;color:var(--muted)}
.scope button.on{background:var(--brand);color:#fff;font-weight:700}
.holiday-card{background:#fdeceb;border:1px solid #f3c2bf;border-radius:12px;padding:12px 14px;margin-bottom:10px;display:flex;gap:10px;align-items:center}
.holiday-card b{color:var(--t-holiday)}
.cal .d.hol{background:#fdeceb}
.cal .d .hn{display:block;font-size:9px;color:var(--t-holiday);line-height:1.2;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.typegrid{display:flex;flex-wrap:wrap;gap:6px}
.typegrid button{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:14px;cursor:pointer}
.typegrid button.on{background:var(--tc);border-color:var(--tc);color:#fff;font-weight:700}
.grp-label{font-size:13px;color:var(--muted);margin:6px 0 4px}
.rem-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;background:#f7f8fa;border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:6px}
.rem-row select,.rem-row input{width:auto !important;padding:7px 8px !important;font-size:15px !important}
.rem-row input[type=number]{width:64px !important}
.rem-row .x{margin-inline-start:auto;border:0;background:transparent;font-size:18px;color:var(--bad);cursor:pointer;padding:2px 8px}
.rem-preview{font-size:13px;color:var(--brand);margin:2px 0 4px}
details.more{border-top:1px solid var(--line);margin-top:6px;padding-top:8px}
details.more summary{cursor:pointer;color:var(--brand);font-size:15px;margin-bottom:8px}
.warnline{background:#fdeceb;color:var(--t-holiday);border-radius:8px;padding:6px 10px;font-size:14px;margin-top:6px}
.tbl{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border-radius:12px;overflow:hidden}
.tbl td,.tbl th{border-bottom:1px solid var(--line);padding:8px 10px;text-align:right;vertical-align:top}
.tbl th{background:#f3f5f7;font-weight:700}
.tag.rep{background:#eaf1fb;color:#2f6fb0}
</style>
</head>

</div>

<input type="file" id="importFile" accept=".json,application/json" hidden>

<script src="seed.js"></script>

var STATUS = {planned:"مخطط", done:"منفذ", missed:"لم يُنفذ", postponed:"مؤجل", cancelled:"ملغي"};
var REPEAT = {"":"لا يتكرر",daily:"كل يوم",weekly:"كل أسبوع",monthly:"كل شهر",yearly:"كل سنة"};
var UNITS = {m:"دقيقة",h:"ساعة",d:"يوم"};
var DEF_REM = {
  school:[{n:1,u:"d",at:"20:00"},{n:1,u:"h"}], class:[{n:1,u:"d",at:"20:00"},{n:1,u:"h"}],
  exchange:[{n:1,u:"d",at:"20:00"},{n:1,u:"h"}], model:[{n:1,u:"d",at:"20:00"},{n:1,u:"h"}],

  personal:[{n:1,u:"h"}], family:[{n:1,u:"d",at:"19:00"},{n:2,u:"h"}], health:[{n:1,u:"d",at:"19:00"},{n:2,u:"h"}],

].map(function(r,i){return {id:"sc"+i,date:r[0],to:r[1],title:r[2],type:r[3],sc:true};});
var MUSIC_ASSESS = {

  "2027-03":[["5–10","العرض الشفوي والأنشطة العملية (من مارس إلى مايو)"],["11–12","الأنشطة العملية (1)"]],
  "2027-04":[["1–4","الأنشطة العملية (2)"],["5–10","العرض الشفوي والأنشطة العملية"],["11–12","اختبار قصير"]],
  "2027-05":[["1–4","الملاحظة (2)"],["5–10","العرض الشفوي والأنشطة العملية"],["11–12","الأنشطة العملية (2)"]]
};
var AR_MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
var AR_DAYS = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];

function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function $(id){return document.getElementById(id);}
function pad(n){return (n<10?"0":"")+n;}
function iso(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function todayISO(){return iso(new Date());}
function parseISO(s){var p=String(s).split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(s,n){var d=parseISO(s);d.setDate(d.getDate()+n);return iso(d);}
function daysBetween(a,b){return Math.round((parseISO(b)-parseISO(a))/864e5);}
function fmtDate(s,withDay){if(!s)return "بدون تاريخ";var d=parseISO(s);return (withDay?AR_DAYS[d.getDay()]+" ":"")+d.getDate()+" "+AR_MONTHS[d.getMonth()]+" "+d.getFullYear();}
function fmtShort(s){var d=parseISO(s);return d.getDate()+" "+AR_MONTHS[d.getMonth()];}
function fmtTime(t){if(!t)return "";var p=t.split(":"),h=+p[0],m=p[1];var ap=h<12?"ص":"م";h=h%12||12;return h+":"+m+" "+ap;}
function fmtRange(a,b){return a===b||!b?fmtShort(a):(parseISO(a).getMonth()===parseISO(b).getMonth()?parseISO(a).getDate()+"–"+fmtShort(b):fmtShort(a)+" – "+fmtShort(b));}
function uid(p){return (p||"e")+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function toast(msg){var t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(function(){t.remove();},2800);}
function isIOS(){return /iPad|iPhone|iPod/.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);}

/* ============ التخزين وترحيل البيانات ============ */
var S;
function blank(){return {v:2,settings:{supervisor:"",lastBackup:null,createdAt:new Date().toISOString()},teachers:[],schools:[],events:[]};}
var OLD_REM={10080:{n:7,u:"d"},1440:{n:1,u:"d"},120:{n:2,u:"h"},60:{n:1,u:"h"},15:{n:15,u:"m"}};
function migrate(st){
  st.settings=st.settings||{};
  var se=st.settings;
  if(!se.scope)se.scope="all";
  if(se.showSchoolCal===undefined)se.showSchoolCal=true;
  se.defRem=se.defRem||{};
  Object.keys(DEF_REM).forEach(function(k){if(!se.defRem[k])se.defRem[k]=clone(DEF_REM[k]);});
  (st.events||[]).forEach(function(e){
    if(Array.isArray(e.reminders))e.reminders=e.reminders.map(function(r){return typeof r==="number"?(OLD_REM[r]?clone(OLD_REM[r]):{n:r,u:"m"}):r;});
    else e.reminders=[];
    if(e.repeat===undefined)e.repeat="";
  });
  st.v=2;return st;
}
function load(){
  var raw=null;try{raw=localStorage.getItem(KEY);}catch(e){}
  if(raw){try{S=JSON.parse(raw);}catch(e){S=null;}}
  if(!S||!S.v){
    S=blank();
    if(window.SEED){S.teachers=SEED.teachers;S.schools=SEED.schools;S.events=SEED.events;S.settings.seeded=true;}
  }
  migrate(S);save(true);
}
function save(quiet){
  try{localStorage.setItem(KEY,JSON.stringify(S));return true;}
  catch(e){if(!quiet)toast("تعذّر الحفظ على هذا الجهاز. خذ نسخة احتياطية الآن.");return false;}
}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist();}catch(e){}

function school(id){return S.schools.find(function(s){return s.id===id;});}
function teacher(id){return S.teachers.find(function(t){return t.id===id;});}
function evById(id){return S.events.find(function(e){return e.id===id;});}
function schoolName(id){var s=school(id);return s?s.name:"";}
function sortEv(a,b){return (a.date||"").localeCompare(b.date||"")||(a.start||"99").localeCompare(b.start||"99");}
function typeOf(e){return e.sc?SC_TYPES[e.type]:(TYPES[e.type]||TYPES.other);}
function evTitle(e){
  if(e.sc)return e.title;
  var t=typeOf(e);
  if(e.title&&e.title!==t.name)return e.title;
  if(e.type==="class"&&e.teacherIds&&e.teacherIds.length){var tt=teacher(e.teacherIds[0]);if(tt)return t.name+": "+tt.name;}
  if(e.schoolId)return t.name+": "+schoolName(e.schoolId);
  return t.name;
}
function inScope(e){var sc=S.settings.scope;if(e.sc)return sc!=="life"||e.type==="holiday";if(sc==="all")return true;return (sc==="work")===isWork(e.type);}

/* ============ التقويم الدراسي ============ */
function holidayOn(date){for(var i=0;i<SCHOOL_CAL.length;i++){var h=SCHOOL_CAL[i];if(h.type==="holiday"&&date>=h.date&&date<=h.to)return h;}return null;}
function scItems(from,to){
  if(!S.settings.showSchoolCal)return [];
  return SCHOOL_CAL.filter(function(h){return h.to>=from&&h.date<=to;});
}

/* ============ التكرار ============ */
function stepDate(d,freq,k,origDay){
  var x=parseISO(d);
  if(freq==="daily")x.setDate(x.getDate()+k);
  else if(freq==="weekly")x.setDate(x.getDate()+7*k);
  else if(freq==="monthly"||freq==="yearly"){
    var base=parseISO(d);var m=base.getMonth()+(freq==="monthly"?k:12*k);
    x=new Date(base.getFullYear(),m,1);var last=new Date(x.getFullYear(),x.getMonth()+1,0).getDate();
    if(origDay>last)return null; x.setDate(origDay);
  }
  return iso(x);
}
function occurrences(e,from,to){
  if(!e.date)return [];
  if(!e.repeat){return e.date>=from&&e.date<=to?[e]:[];}
  var out=[],od=parseISO(e.date).getDate(),end=e.until&&e.until<to?e.until:to;
  for(var k=0;k<800;k++){
    var d=stepDate(e.date,e.repeat,k,od);
    if(d===null)continue;
    if(d>end)break;
    if(d>=from){var o=Object.assign({},e,{date:d,_occ:true,_master:e.id});out.push(o);}
  }
  return out;
}
function itemsBetween(from,to,opts){
  opts=opts||{};
  var out=[];
  S.events.forEach(function(e){if(!inScope(e))return;if(opts.type&&e.type!==opts.type)return;out=out.concat(occurrences(e,from,to));});
  if(!opts.type&&opts.withSC!==false)scItems(from,to).forEach(function(h){if(inScope(h))out.push(h);});
  return out.sort(sortEv);
}

/* ============ التنبيهات ============ */
function evStart(e){var d=parseISO(e.date);if(e.start){var p=e.start.split(":");d.setHours(+p[0],+p[1],0,0);}return d;}
function alarmTime(e,r){
  var base=parseISO(e.date),d;
  if(r.k==="abs"){if(!r.at)return null;var q=r.at.split("T"),dd=parseISO(q[0]),tp=(q[1]||"07:00").split(":");dd.setHours(+tp[0],+tp[1],0,0);return dd;}
  var n=+r.n||0;
  if(r.u==="d"){
    d=new Date(base);d.setDate(d.getDate()-n);
    var at=r.at||(e.start?e.start:"19:00");if(!r.at&&!e.start&&n===0)at="07:00";
    var p=at.split(":");d.setHours(+p[0],+p[1],0,0);return d;
  }
  var ref=e.start?evStart(e):(function(){var x=new Date(base);x.setHours(7,0,0,0);return x;})();
  return new Date(ref.getTime()-n*(r.u==="h"?3600e3:60e3));
}
function remLabel(r){
  if(r.k==="abs")return "في "+(r.at?fmtDate(r.at.split("T")[0],true)+" "+fmtTime(r.at.split("T")[1]):"وقت محدد");
  var s=r.u==="d"&&+r.n===0?"في نفس اليوم":"قبل "+r.n+" "+UNITS[r.u];
  if(r.u==="d"&&r.at)s+=" الساعة "+fmtTime(r.at);
  return s;
}
function fmtAlarm(d){return AR_DAYS[d.getDay()]+" "+d.getDate()+" "+AR_MONTHS[d.getMonth()]+" — "+fmtTime(pad(d.getHours())+":"+pad(d.getMinutes()));}

/* ============ ملفات التقويم (ics) ============ */
function icsEsc(s){return String(s||"").replace(/\\/g,"\\\\").replace(/;/g,"\\;").replace(/,/g,"\\,").replace(/\r?\n/g,"\\n");}
function fold(line){
  var out=[],cur="",bytes=0,enc=new TextEncoder();
  for(var ch of line){var b=enc.encode(ch).length;if(bytes+b>73){out.push(cur);cur=" "+ch;bytes=1+b;}else{cur+=ch;bytes+=b;}}
  out.push(cur);return out.join("\r\n");
}
function icsDT(date,time){return date.replace(/-/g,"")+"T"+time.replace(":","")+"00";}
function veventLines(e){
  var L=[],now=new Date();
  var stamp=now.getUTCFullYear()+pad(now.getUTCMonth()+1)+pad(now.getUTCDate())+"T"+pad(now.getUTCHours())+pad(now.getUTCMinutes())+"00Z";
  L.push("BEGIN:VEVENT","UID:"+e.id+"@msa","DTSTAMP:"+stamp);
  var endDate=e.to||e.date;
  if(e.start){
    L.push("DTSTART:"+icsDT(e.date,e.start));
    var end=e.end||(function(){var p=e.start.split(":");var h=Math.min(23,+p[0]+1);return pad(h)+":"+p[1];})();
    L.push("DTEND:"+icsDT(e.date,end));
  }else{
    L.push("DTSTART;VALUE=DATE:"+e.date.replace(/-/g,""),"DTEND;VALUE=DATE:"+addDays(endDate,1).replace(/-/g,""));
  }
  if(e.repeat){
    var rr="RRULE:FREQ="+{daily:"DAILY",weekly:"WEEKLY",monthly:"MONTHLY",yearly:"YEARLY"}[e.repeat];
    if(e.until)rr+=";UNTIL="+e.until.replace(/-/g,"")+(e.start?"T235959":"");
    L.push(rr);
  }
  L.push("SUMMARY:"+icsEsc(evTitle(e)));
  var loc=e.place||(e.schoolId?"مدرسة "+schoolName(e.schoolId):"");
  if(loc)L.push("LOCATION:"+icsEsc(loc));
  var desc=[];
  if(e.teacherIds&&e.teacherIds.length)desc.push("المعلمون: "+e.teacherIds.map(function(id){var t=teacher(id);return t?t.name:"";}).join("، "));
  if(e.notes)desc.push(e.notes);
  desc.push("من برنامج مساعد المشرف التربوي");
  L.push("DESCRIPTION:"+icsEsc(desc.join("\n")));
  var start=evStart(e),seen={};
  (e.reminders||[]).forEach(function(r){
    var a=alarmTime(e,r);if(!a)return;
    var mins=Math.round((a-start)/60000);
    var t=mins<=0?"-PT"+(-mins)+"M":"PT"+mins+"M";if(mins===0)t="PT0M";
    if(seen[t])return;seen[t]=1;
    L.push("BEGIN:VALARM","ACTION:DISPLAY","DESCRIPTION:"+icsEsc(evTitle(e)),"TRIGGER:"+t,"END:VALARM");
  });
  L.push("END:VEVENT");
  return L;
}
function buildICS(list){
  var L=["BEGIN:VCALENDAR","VERSION:2.0","PRODID:-//MSA//Supervisor Assistant//AR","CALSCALE:GREGORIAN","METHOD:PUBLISH"];
  list.forEach(function(e){L=L.concat(veventLines(e));});
  L.push("END:VCALENDAR");
  return L.map(fold).join("\r\n")+"\r\n";
}
function deliverFile(text,name,mime){
  var blob=new Blob([text],{type:mime});
  if(isIOS()&&mime.indexOf("calendar")>-1){
    var u=URL.createObjectURL(blob);window.location.href=u;setTimeout(function(){URL.revokeObjectURL(u);},60000);return;
  }
  var a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove();},2000);
}
function addToCalendar(ids){
  var list=ids.map(evById).filter(function(e){return e&&e.date;});
  if(!list.length){toast("لا توجد مواعيد بتاريخ لإضافتها");return;}
  deliverFile(buildICS(list),list.length===1?"موعد.ics":"مواعيد.ics","text/calendar;charset=utf-8");
  list.forEach(function(e){e.inCalendar=true;});save();
}
function addSchoolCalToCalendar(ids){
  var rem=S.settings.defRem.holiday||[];
  var list=SCHOOL_CAL.filter(function(h){return ids.indexOf(h.id)>-1;}).map(function(h){
    return {id:"msa-"+h.id+"-2627",date:h.date,to:h.to,title:(h.type==="holiday"?"🏖️ ":"📚 ")+h.title,notes:"التقويم الدراسي 2026/2027م — وزارة التعليم",reminders:h.type==="holiday"?clone(rem):[],teacherIds:[]};
  });
  if(!list.length)return;
  deliverFile(buildICS(list),"التقويم_الدراسي.ics","text/calendar;charset=utf-8");
  S.settings.scInCal=S.settings.scInCal||{};ids.forEach(function(i){S.settings.scInCal[i]=1;});save();
}
function gcalLink(e){
  var dates=e.start?icsDT(e.date,e.start)+"/"+icsDT(e.date,e.end||e.start):e.date.replace(/-/g,"")+"/"+addDays(e.date,1).replace(/-/g,"");
  var loc=e.place||(e.schoolId?"مدرسة "+schoolName(e.schoolId):"");
  return "https://calendar.google.com/calendar/render?action=TEMPLATE&text="+encodeURIComponent(evTitle(e))+"&dates="+dates+"&location="+encodeURIComponent(loc)+"&details="+encodeURIComponent(e.notes||"");
}

/* ============ مكونات العرض ============ */
function evCard(e,opts){
  opts=opts||{};
  var t=typeOf(e),d=e.date?parseISO(e.date):null;
  var when=opts.timeOnly?(e.start?"<b>"+esc(fmtTime(e.start).split(" ")[0])+"</b>"+esc(fmtTime(e.start).split(" ")[1]):"<b>—</b>اليوم")
    :(d?"<b>"+d.getDate()+"</b>"+AR_MONTHS[d.getMonth()]:"<b>؟</b>");
  var meta=[];
  if(e.sc){
    if(e.to&&e.to!==e.date)meta.push(fmtRange(e.date,e.to)+" ("+(daysBetween(e.date,e.to)+1)+" أيام)");
    return '<div class="ev" style="--tc:'+t.c+'" data-sc="'+esc(e.id)+'"><div class="when">'+when+'</div><div class="body"><div class="ttl">'+(e.type==="holiday"?"🏖️ ":"📚 ")+esc(e.title)+
      '</div><div class="meta"><span class="tag type">'+t.name+"</span> "+esc(meta.join(" · "))+"</div></div></div>";
  }
  if(!opts.timeOnly&&e.start)meta.push(fmtTime(e.start));
  if(e.schoolId&&evTitle(e).indexOf(schoolName(e.schoolId))<0)meta.push("🏫 "+schoolName(e.schoolId));
  if(e.place)meta.push("📍 "+e.place);
  if(e.type!=="class"&&e.teacherIds&&e.teacherIds.length)meta.push("👤 "+e.teacherIds.length+" معلم");
  var st=e.status&&e.status!=="planned"&&!e.repeat?'<span class="tag '+e.status+'">'+STATUS[e.status]+"</span>":"";
  var rep=e.repeat?'<span class="tag rep">🔁 '+REPEAT[e.repeat]+"</span>":"";
  var cal=e.inCalendar&&(e.status==="planned"||e.repeat)?'<span class="tag">🔔 في التقويم</span>':"";
  var hol=!e.sc&&e.date&&holidayOn(e.date)&&isWork(e.type)&&e.status==="planned"?'<div class="warnline">⚠️ هذا اليوم إجازة: '+esc(holidayOn(e.date).title)+"</div>":"";
  var id=e._master||e.id;
  return '<div class="ev" style="--tc:'+t.c+'" data-ev="'+esc(id)+'"><div class="when">'+when+'</div><div class="body">'+
    '<div class="ttl">'+esc(evTitle(e))+'</div><div class="meta"><span class="tag type">'+t.name+"</span>"+st+rep+cal+" "+esc(meta.join(" · "))+"</div>"+hol+
    (opts.actions?'<div class="sheet-actions">'+opts.actions(e)+"</div>":"")+"</div></div>";
}
function bindEvCards(root){
  root.querySelectorAll("[data-ev]").forEach(function(el){
    el.addEventListener("click",function(ev){if(ev.target.closest("button,a"))return;openEvent(el.getAttribute("data-ev"));});
  });
  root.querySelectorAll("[data-sc]").forEach(function(el){el.addEventListener("click",function(){location.hash="#schoolcal";});});
  root.querySelectorAll("[data-act]").forEach(function(b){
    b.addEventListener("click",function(ev){
      ev.stopPropagation();var id=b.getAttribute("data-id"),a=b.getAttribute("data-act"),e=evById(id);
      if(!e)return;
      if(a==="done"){e.status="done";save();toast("تم تسجيل التنفيذ ✓");render();}
      if(a==="cal")addToCalendar([id]);
      if(a==="resched")openEvent(id,{resched:true});
    });
  });
}
function quickActions(e){
  if(e.sc)return "";
  var id=esc(e._master||e.id),h="";
  if(!e.repeat){
    if(e.status==="planned"||e.status==="missed"||e.status==="postponed")h+='<button class="btn sm" data-act="done" data-id="'+id+'">✓ تم</button>';
    if(e.status==="missed"||e.status==="postponed")h+='<button class="btn sm" data-act="resched" data-id="'+id+'">↻ موعد جديد</button>';
  }
  if((e.status==="planned"||e.repeat)&&!e.inCalendar&&(e.repeat||e.date>=todayISO()))h+='<button class="btn sm" data-act="cal" data-id="'+id+'">🔔 أضف للتقويم</button>';
  return h;
}
function scopeBar(){
  var sc=S.settings.scope;
  return '<div class="scope">'+[["all","الكل"],["work","💼 العمل"],["life","🏡 حياتي"]].map(function(x){return '<button data-scope="'+x[0]+'"'+(sc===x[0]?' class="on"':"")+">"+x[1]+"</button>";}).join("")+"</div>";
}
function bindScope(){
  $("view").querySelectorAll("[data-scope]").forEach(function(b){b.onclick=function(){S.settings.scope=b.dataset.scope;save(true);render();};});
}

function viewEvents(){

    else list=S.events.filter(function(e){return e.repeat&&inScope(e)&&(!f.type||e.type===f.type);}).sort(sortEv);
    if(!list.length)h+='<div class="empty">'+(f.filter==="repeat"?"لا توجد مواعيد متكررة. عند إضافة موعد اختر «يتكرر».":"لا توجد مواعيد")+"</div>";
    var lastM="";
    list.forEach(function(e){
      if(f.filter!=="repeat"){var d=parseISO(e.date),m=AR_MONTHS[d.getMonth()]+" "+d.getFullYear();if(m!==lastM){h+="<h2>"+m+"</h2>";lastM=m;}}
      h+=evCard(e,{actions:f.filter!=="past"?quickActions:null});

    if(f.filter==="upcoming"){var ids={};list.forEach(function(e){if(!e.sc&&!e.inCalendar&&(e.status==="planned"||e.repeat))ids[e._master||e.id]=1;});var n=Object.keys(ids).length;
      if(n)h+='<div class="row" style="margin-top:10px"><button class="btn" id="calAll">🔔 أضف '+n+" موعد قادم للتقويم</button></div>";
      f._calIds=Object.keys(ids);}
  }else{
    var base=f.month?parseISO(f.month+"-01"):new Date();base=new Date(base.getFullYear(),base.getMonth(),1);
    var mKey=base.getFullYear()+"-"+pad(base.getMonth()+1);f.month=mKey;
    h+='<div class="cal-head"><button class="btn sm" data-mv="1">التالي ›</button><b>'+AR_MONTHS[base.getMonth()]+" "+base.getFullYear()+'</b><button class="btn sm" data-mv="-1">‹ السابق</button></div>';
    h+='<div class="cal">'+["أحد","إثنين","ثلاثاء","أربعاء","خميس","جمعة","سبت"].map(function(d){return '<div class="dow">'+d+"</div>";}).join("");
    var start=new Date(base);start.setDate(1-base.getDay());
    var gridEnd=new Date(start);gridEnd.setDate(start.getDate()+41);
    var all=itemsBetween(iso(start),iso(gridEnd),{type:f.type});
    for(var i=0;i<42;i++){
      var dd=new Date(start);dd.setDate(start.getDate()+i);var k=iso(dd);
      if(i>=35&&dd.getMonth()!==base.getMonth())break;
      var de=all.filter(function(e){return !e.sc&&e.date===k&&e.status!=="cancelled";});
      var hl=S.settings.showSchoolCal?holidayOn(k):null;
      h+='<div class="d'+(dd.getMonth()!==base.getMonth()?" out":"")+(k===t?" today":"")+(k===f.sel?" sel":"")+(hl?" hol":"")+'" data-day="'+k+'">'+dd.getDate()+
        (hl?'<span class="hn">'+esc(hl.title.replace("إجازة ",""))+"</span>":"")+
        '<div class="dots">'+de.slice(0,6).map(function(e){return '<i style="--tc:'+typeOf(e).c+'"></i>';}).join("")+"</div></div>";
    }
    h+="</div>";
    var sel=f.sel||t;var se=itemsBetween(sel,sel,{type:f.type}).concat(f.type?[]:[]);
    var scDay=S.settings.showSchoolCal&&!f.type?SCHOOL_CAL.filter(function(x){return sel>=x.date&&sel<=x.to;}):[];
    se=se.filter(function(e){return !e.sc;}).concat(scDay);
    h+="<h2>"+fmtDate(sel,true)+' <span class="count">'+se.length+"</span></h2>";
    h+=se.length?se.map(function(e){return evCard(e,{timeOnly:true,actions:quickActions});}).join(""):'<div class="empty">لا مواعيد في هذا اليوم. <a href="#" id="addOnDay">أضف موعدًا</a></div>';
    if(MUSIC_ASSESS[mKey]&&S.settings.scope!=="life")h+='<h2>🎵 تقويم المهارات الموسيقية هذا الشهر</h2><div class="card">'+MUSIC_ASSESS[mKey].map(function(x){return "<div><b>الصفوف "+x[0]+":</b> "+esc(x[1])+"</div>";}).join("")+"</div>";
  }
  $("view").innerHTML=h;bindEvCards($("view"));bindScope();
  $("view").querySelectorAll("[data-mode]").forEach(function(b){b.onclick=function(){f.mode=b.dataset.mode;render();};});
  $("view").querySelectorAll("[data-type]").forEach(function(b){b.onclick=function(){f.type=b.dataset.type;render();};});
  $("view").querySelectorAll("[data-filter]").forEach(function(b){b.onclick=function(){f.filter=b.dataset.filter;render();};});
  $("view").querySelectorAll("[data-mv]").forEach(function(b){b.onclick=function(){var d=parseISO(f.month+"-01");d.setMonth(d.getMonth()+ +b.dataset.mv);f.month=d.getFullYear()+"-"+pad(d.getMonth()+1);f.sel=null;render();};});
  $("view").querySelectorAll("[data-day]").forEach(function(b){b.onclick=function(){f.sel=b.dataset.day;render();};});
  var ca=$("calAll");if(ca)ca.onclick=function(){addToCalendar(f._calIds||[]);};
  var ad=$("addOnDay");if(ad)ad.onclick=function(ev){ev.preventDefault();openEvent(null,{date:f.sel||t});};
}

/* ============ محرر التنبيهات ============ */
function remEditor(box,rems,getEv){
  function draw(){
    var h=rems.map(function(r,i){
      var kind='<select data-i="'+i+'" data-f="k"><option value="rel"'+(r.k!=="abs"?" selected":"")+'>قبل الموعد</option><option value="abs"'+(r.k==="abs"?" selected":"")+">في وقت محدد</option></select>";
      var body;
      if(r.k==="abs")body='<input type="datetime-local" data-i="'+i+'" data-f="at" value="'+esc(r.at||"")+'">';
      else body='<input type="number" min="0" max="999" data-i="'+i+'" data-f="n" value="'+esc(r.n)+'"><select data-i="'+i+'" data-f="u">'+Object.keys(UNITS).map(function(u){return '<option value="'+u+'"'+(r.u===u?" selected":"")+">"+UNITS[u]+"</option>";}).join("")+"</select>"+
        (r.u==="d"?'<span class="small">الساعة</span><input type="time" data-i="'+i+'" data-f="at" value="'+esc(r.at||"")+'">':"");
      var prev="";
      if(getEv){var e=getEv();if(e&&e.date){var a=alarmTime(e,r);if(a)prev='<div class="rem-preview" style="width:100%">🔔 يرن: '+fmtAlarm(a)+(e.repeat?" (ويتكرر مع الموعد)":"")+"</div>";}}
      return '<div class="rem-row">'+kind+body+'<button type="button" class="x" data-del="'+i+'" aria-label="حذف">✕</button>'+prev+"</div>";
    }).join("")||'<p class="small">بدون تنبيه</p>';
    h+='<div class="row"><button type="button" class="btn sm" data-add="1">+ إضافة تنبيه</button></div>';
    box.innerHTML=h;
    box.querySelectorAll("[data-f]").forEach(function(el){
      el.onchange=function(){var r=rems[+el.dataset.i],f=el.dataset.f;
        if(f==="k"){if(el.value==="abs"){var e=getEv&&getEv();r.k="abs";r.at=(e&&e.date?addDays(e.date,-1):todayISO())+"T19:00";delete r.n;delete r.u;}else{rems[+el.dataset.i]={n:1,u:"h"};}}
        else if(f==="n")r.n=Math.max(0,+el.value||0);
        else if(f==="u"){r.u=el.value;if(r.u!=="d")delete r.at;}
        else if(f==="at")r.at=el.value;
        draw();};
    });
    box.querySelectorAll("[data-del]").forEach(function(b){b.onclick=function(){rems.splice(+b.dataset.del,1);draw();};});
    box.querySelector("[data-add]").onclick=function(){rems.push({n:30,u:"m"});draw();};
  }
  draw();box._redraw=draw;
}

  var d=t?clone(t):{id:"",name:"",schoolId:"",stage:"",periods:"",appoint:"",grade:"",fileNo:"",phone:"",email:"",status:"على رأس العمل",notes:""};
  var F=[["name","الاسم"],["fileNo","رقم الملف الوظيفي"],["stage","المرحلة الدراسية"],["periods","عدد الحصص"],["appoint","صفة التعيين"],["grade","الدرجة الوظيفية"],["phone","الهاتف"],["email","البريد الإلكتروني"]];
  function fld(f){return '<div class="field"><label>'+f[1]+'</label><input id="t_'+f[0]+'" value="'+esc(d[f[0]]==null?"":d[f[0]])+'"></div>';}
  var h="<h3>"+(isNew?"معلم جديد":"تعديل بيانات المعلم")+"</h3>"+
    F.slice(0,2).map(fld).join("")+
    '<div class="field"><label>المدرسة</label><select id="tSchool">'+S.schools.slice().sort(function(a,b){return a.name.localeCompare(b.name,"ar");}).map(function(s){return '<option value="'+esc(s.id)+'"'+(s.id===d.schoolId?" selected":"")+">"+esc(s.name)+"</option>";}).join("")+"</select></div>"+
    F.slice(2).map(fld).join("")+
    '<div class="field"><label>الحالة</label><select id="t_status">'+["على رأس العمل","منقول","إجازة","متقاعد"].map(function(x){return "<option"+(x===d.status?" selected":"")+">"+x+"</option>";}).join("")+"</select></div>"+
    '<div class="field"><label>ملاحظات</label><textarea id="t_notes">'+esc(d.notes||"")+"</textarea></div>"+
    '<div class="row"><button class="btn pri" id="tSave">حفظ</button><button class="btn" id="tCancel">إلغاء</button></div>';
  modal(h,function(bg,close){
    bg.querySelector("#tCancel").onclick=close;
    bg.querySelector("#tSave").onclick=function(){
      F.forEach(function(f){d[f[0]]=bg.querySelector("#t_"+f[0]).value.trim();});
      d.schoolId=bg.querySelector("#tSchool").value;d.status=bg.querySelector("#t_status").value;d.notes=bg.querySelector("#t_notes").value.trim();
      if(!d.name){toast("اكتب اسم المعلم");return;}
      if(isNew){d.id=d.fileNo||uid("t");if(teacher(d.id)){toast("رقم الملف موجود لمعلم آخر");return;}S.teachers.push(d);}
      else{Object.assign(t,d);}
      save();close();toast("تم الحفظ ✓");if(isNew)location.hash="#teacher/"+encodeURIComponent(d.id);else render();
    };
  });
}
function openSchool(id){
  var s=id?school(id):null,isNew=!s;
  var h="<h3>"+(isNew?"مدرسة جديدة":"تعديل المدرسة")+'</h3><div class="field"><label>اسم المدرسة</label><input id="sName" value="'+esc(s?s.name:"")+'"></div>'+
    '<div class="field"><label>الولاية</label><input id="sW" list="wl" value="'+esc(s?s.wilaya:"")+'"><datalist id="wl">'+wilayas().map(function(w){return "<option>"+esc(w)+"</option>";}).join("")+"</datalist></div>"+
    '<div class="row"><button class="btn pri" id="sSave">حفظ</button><button class="btn" id="sCancel">إلغاء</button></div>';
  modal(h,function(bg,close){
    bg.querySelector("#sCancel").onclick=close;
    bg.querySelector("#sSave").onclick=function(){
      var n=bg.querySelector("#sName").value.trim(),w=bg.querySelector("#sW").value.trim();if(!n){toast("اكتب اسم المدرسة");return;}
      if(isNew)S.schools.push({id:uid("s"),name:n,wilaya:w});else{s.name=n;s.wilaya=w;}
      save();close();toast("تم الحفظ ✓");render();
    };
  });
}

/* ============ التنقل ============ */
function render(){
  var hsh=(location.hash||"#today").slice(1).split("/");route=hsh[0]||"today";param=hsh[1]?decodeURIComponent(hsh[1]):null;
  var tab={teacher:"teachers",school:"schools",backup:"more",install:"more",settings:"more",schoolcal:"more"}[route]||route;
  document.querySelectorAll("#tabs a").forEach(function(a){a.classList.toggle("on",a.dataset.r===tab);});
  var V={today:viewToday,events:viewEvents,teachers:viewTeachers,teacher:function(){viewTeacher(param);},schools:viewSchools,school:function(){viewSchool(param);},
    more:viewMore,backup:viewBackup,install:viewInstall,settings:viewSettings,schoolcal:viewSchoolCal};
  (V[route]||viewToday)();
  var d=new Date();$("todayLabel").textContent=AR_DAYS[d.getDay()]+" "+fmtDate(todayISO());
}
window.addEventListener("hashchange",function(){render();window.scrollTo(0,0);});
$("fab").onclick=function(){
  var p={};if(route==="teacher"&&param){var t=teacher(param);if(t)p={type:"class",schoolId:t.schoolId,teacherIds:[t.id]};}
  if(route==="school"&&param)p={type:"school",schoolId:param};
  if(route==="events"&&evView.mode==="month"&&evView.sel)p.date=evView.sel;
  openEvent(null,p);
};
load();render();
var lastDay=todayISO();setInterval(function(){if(todayISO()!==lastDay){lastDay=todayISO();render();}},60000);

/* ============ العمل بدون إنترنت ============ */
if("serviceWorker" in navigator&&location.protocol.indexOf("http")===0){
  navigator.serviceWorker.register("sw.js").then(function(reg){
    reg.addEventListener("updatefound",function(){var w=reg.installing;w&&w.addEventListener("statechange",function(){
      if(w.state==="installed"&&navigator.serviceWorker.controller)toast("نسخة جديدة جاهزة. أغلق البرنامج وافتحه لتطبيقها.");});});
  }).catch(function(){});
}
</script>
